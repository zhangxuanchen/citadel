authz:
  security:
    rate-limit:
      enabled: true
      max-requests: 120
      window: 1m
    login-protection:
      enabled: true
      max-failures: 5
      lock-duration: 15m

logging:
  level:
    root: info
    "[cn.com.app.security]": info
    "[org.springframework.security]": warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%thread] %logger{36} - %msg%n"
